<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Your personal, distraction-free YouTube library.">
  <title>FocusTube</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
      <span class="brand-icon">F</span>
      FocusTube
    </a>
    <button id="settings-toggle" class="icon-button" aria-label="Settings">⚙</button>
  </header>

  <main class="shell">
    <section class="welcome">
      <p class="eyebrow">YOUR PERSONAL VIDEO LIBRARY</p>
      <h1>Watch with purpose.</h1>
      <p>Only the channels and videos you approve.</p>
    </section>

    <section class="add-panel">
      <h2>Add to your library</h2>
      <form id="channel-form">
        <input id="channel-url" type="text"
          placeholder="YouTube channel URL or @handle" required>
        <button type="submit">Add channel</button>
      </form>
      <form id="video-form">
        <input id="video-url" type="text"
          placeholder="YouTube video URL" required>
        <button type="submit">Approve video</button>
      </form>
      <p id="add-status" class="status" aria-live="polite"></p>
    </section>

    <section id="settings-panel" class="settings-panel" hidden>
      <h2>Settings</h2>
      <form id="api-form">
        <label for="api-key">YouTube Data API key</label>
        <input id="api-key" type="password" placeholder="Paste API key">
        <button type="submit">Save API key</button>
      </form>
      <div class="settings-actions">
        <button id="refresh-button" class="secondary">Refresh channels</button>
        <button id="export-button" class="secondary">Export library</button>
        <label class="file-button secondary">
          Import library
          <input id="import-file" type="file" accept="application/json">
        </label>
      </div>
      <p class="muted small">Your library is stored in this browser. Do not share your API key.</p>
    </section>

    <nav class="main-nav" aria-label="Library navigation">
      <button class="nav-button active" data-view="home">
        Home <span id="home-count">0</span>
      </button>
      <button class="nav-button" data-view="saved">
        Watch Later <span id="saved-count">0</span>
      </button>
      <button class="nav-button" data-view="history">
        History <span id="history-count">0</span>
      </button>
      <button class="nav-button" data-view="channels">
        Channels <span id="channel-count">0</span>
      </button>
    </nav>

    <section class="library-section">
      <div class="library-heading">
        <div>
          <p class="eyebrow">YOUR COLLECTION</p>
          <h2 id="view-title">Home</h2>
        </div>
        <input id="filter-input" type="search" placeholder="Search library">
      </div>

      <p id="feed-count" class="muted small"></p>
      <div id="video-grid" class="video-grid"></div>
      <div id="channels-list" class="channels-list" hidden></div>
    </section>
  </main>

  <dialog id="player-dialog">
    <div class="player-header">
      <div>
        <h2 id="player-title">Video</h2>
        <p id="player-channel" class="muted"></p>
      </div>
      <button id="close-player" class="icon-button" aria-label="Close">✕</button>
    </div>
    <div class="player-frame">
      <iframe id="youtube-player"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </div>
  </dialog>

  <footer>
    <p>FocusTube · A quieter way to watch.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
